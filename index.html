<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="google-site-verification" content="49UybodNMz6njDc8qs7Xrh6QfvXnw0ScyJBZGprhVtg" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>عجلة الحظ - لعبة الإقصاء والمسابقات التفاعلية</title>
    <meta name="description" content="أفضل موقع عربي لعمل قرعة عشوائية وعجلة حظ تفاعلية للمسابقات بنظام الإقصاء. سهل الاستخدام، سريع، ومجاني تماماً.">
    <meta name="keywords" content="عجلة الحظ, قرعة عشوائية, لعبة الإقصاء, مسابقات, اختيار أسماء عشوائي, تدوير العجلة">
    <meta name="author" content="Kinanortiez">

    <meta name="google-site-verification" content="googleb58f888cb260f4a" />

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3112/3112946.png" type="image/png">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* --- الأساسيات والتنسيق العام --- */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #1a1a2e; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 10px; 
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .controls { 
            width: 100%; max-width: 380px; background: #16213e; 
            padding: 15px; border-radius: 15px; margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 5;
        }
        .input-group { display: flex; gap: 5px; }
        input { 
            flex: 1; padding: 12px; border: none; border-radius: 8px; 
            background: #0f3460; color: white; font-size: 16px; 
        }
        #itemsList { 
            list-style: none; padding: 0; max-height: 80px; 
            overflow-y: auto; margin: 10px 0; border-radius: 8px;
        }
        #itemsList li { 
            background: rgba(255,255,255,0.05); margin: 3px 0; padding: 10px; 
            border-radius: 5px; display: flex; justify-content: space-between; font-size: 14px;
        }

        /* --- العجلة --- */
        .wheel-container { position: relative; margin: 10px 0; z-index: 1; }
        .arrow { 
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%); 
            width: 0; height: 0; border-left: 15px solid transparent; 
            border-right: 15px solid transparent; border-top: 30px solid #e94560; 
            z-index: 10; 
        }
        canvas { 
            max-width: 85vw; max-height: 85vw; border-radius: 50%; 
            border: 5px solid #16213e; box-shadow: 0 0 25px rgba(0,0,0,0.5);
        }

        /* --- النافذة المنبثقة (Modal) --- */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; z-index: 9999; 
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); 
        }
        .modal-content { 
            background: #16213e; padding: 30px; border-radius: 20px; 
            text-align: center; width: 85%; max-width: 320px; 
            border: 2px solid #e94560;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        /* حركات الفائز النهائي */
        .final-celebration .modal-content {
            border: 3px solid #ffd700;
            background: #2a0815;
            animation: pulse-box 2s infinite ease-in-out;
        }
        #winnerName { font-size: 2.5rem; color: #fff; margin: 15px 0; }
        .final-celebration #winnerName {
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            animation: pulse-text 1.5s infinite ease-in-out;
        }
        .trophy { display: none; font-size: 5rem; margin-bottom: 10px; }
        .final-celebration .trophy { 
            display: block; 
            animation: bounce-trophy 2s infinite ease-in-out;
        }

        /* --- الأزرار --- */
        .modal-btns { display: flex; gap: 10px; margin-top: 25px; }
        button { 
            padding: 12px; border: none; border-radius: 10px; 
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .keep-btn { background: #0f3460; color: white; border: 1px solid #e94560; flex: 1; }
        .exclude-btn { background: #e94560; color: white; flex: 1; }
        #spinBtn { width: 100%; height: 50px; background: #e94560; color: white; margin-top: 5px; font-size: 1.1rem; border-radius: 10px; }

        /* --- تعريف الحركات (Animations) --- */
        @keyframes pulse-box {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(255, 215, 0, 0.6); }
        }
        @keyframes pulse-text {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); text-shadow: 0 0 30px #ffd700; }
        }
        @keyframes bounce-trophy {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="أدخل اسماً...">
            <button onclick="addItem()" style="background:#e94560; color:white; border-radius:8px;">إضافة</button>
        </div>
        <ul id="itemsList"></ul>
        <button id="spinBtn" onclick="spinWheel()">تدوير العجلة</button>
    </div>

    <div class="wheel-container">
        <div class="arrow"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <div class="trophy">🏆</div>
            <h3 id="modalTitle" style="color: #888; margin: 0;">الاسم المختار</h3>
            <h2 id="winnerName"></h2>
            <div id="actionButtons" class="modal-btns">
                <button class="keep-btn" onclick="closeModal()">احتفاظ</button>
                <button class="exclude-btn" onclick="excludeItem()">إقصاء</button>
            </div>
            <button id="finalCloseBtn" style="display:none; width: 100%; background: #ffd700; color: #1a1a2e; margin-top: 15px;" onclick="resetToWinnerOnly()">لعبة جديدة (مع الفائز)</button>
        </div>
    </div>

    <audio id="tickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
    <audio id="cheerSound" src="https://www.soundjay.com/human/sounds/applause-01.mp3"></audio>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const tickSound = document.getElementById('tickSound');
        const cheerSound = document.getElementById('cheerSound');
        const modal = document.getElementById('resultModal');

        let items = ["ياسين", "عامر"];
        let angle = 0, velocity = 0, isSpinning = false, lastTickAngle = 0;
        let selectedIndex = -1;

        function drawWheel() {
            const num = items.length;
            if (num === 0) { ctx.clearRect(0,0,400,400); return; }
            const arc = (2 * Math.PI) / num;
            ctx.clearRect(0, 0, 400, 400);
            items.forEach((item, i) => {
                const segAngle = angle + i * arc;
                ctx.beginPath();
                // --- التعديل الجديد لألوان متعددة ---
                ctx.fillStyle = `hsl(${(i * 360) / num}, 70%, 50%)`;
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 190, segAngle, segAngle + arc);
                ctx.fill();
                ctx.save();
                ctx.translate(200, 200);
                ctx.rotate(segAngle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 18px Arial";
                ctx.fillText(item, 175, 10);
                ctx.restore();
            });
        }

        function addItem() {
            const input = document.getElementById('nameInput');
            if (input.value.trim()) {
                items.push(input.value.trim());
                input.value = ""; updateList(); drawWheel();
            }
        }

        function updateList() {
            document.getElementById('itemsList').innerHTML = items.map((it, i) => 
                `<li>${it} <span onclick="items.splice(${i},1);updateList();drawWheel()">❌</span></li>`).join('');
        }

        function spinWheel() {
            if (isSpinning || items.length <= 1) return;
            velocity = 0.7 + Math.random() * 0.5;
            isSpinning = true;
            requestAnimationFrame(animate);
        }

        function animate() {
            if (velocity > 0.005) {
                angle += velocity;
                velocity *= 0.985;
                if (Math.abs(angle - lastTickAngle) > (Math.PI * 2 / items.length) / 2) {
                    tickSound.currentTime = 0; tickSound.play().catch(()=>{});
                    lastTickAngle = angle;
                }
                drawWheel();
                requestAnimationFrame(animate);
            } else {
                isSpinning = false;
                showResult();
            }
        }

        function showResult() {
            const num = items.length;
            const arc = (2 * Math.PI) / num;
            const arrowPos = 1.5 * Math.PI;
            const normalizedAngle = (arrowPos - angle) % (2 * Math.PI);
            const finalAngle = normalizedAngle < 0 ? normalizedAngle + (2 * Math.PI) : normalizedAngle;
            selectedIndex = Math.floor(finalAngle / arc) % num;

            document.getElementById('winnerName').innerText = items[selectedIndex];

            if (items.length === 1) {
                modal.classList.add('final-celebration');
                document.getElementById('modalTitle').style.display = "none";
                document.getElementById('actionButtons').style.display = "none";
                document.getElementById('finalCloseBtn').style.display = "block";
                cheerSound.play();
                launchCentralConfetti();
            } else {
                modal.classList.remove('final-celebration');
                document.getElementById('actionButtons').style.display = "flex";
                document.getElementById('finalCloseBtn').style.display = "none";
            }
            modal.style.display = "flex";
        }

        function launchCentralConfetti() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                zIndex: 10000
            });
        }

        function excludeItem() { 
            items.splice(selectedIndex, 1); 
            updateList(); drawWheel(); closeModal(); 
            if (items.length === 1) showResult(); 
        }

        function resetToWinnerOnly() {
            items = [items[selectedIndex]];
            updateList(); drawWheel(); closeModal();
        }

        function closeModal() { modal.style.display = "none"; }

        updateList(); drawWheel();
    </script>
</body>
</html>
